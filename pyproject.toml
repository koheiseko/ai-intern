[project]
name = "ai-intern"
version = "0.1.0"
description = "AI Intern"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["intern"]

[tool.uv.build-backend]
module-name = "intern"
module-root = ""

[tool.uv]
package = true
python-preference = "managed"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = [
    "E",  
    "W",  
    "F",  
    "I",  
    "B",  
    "C4",
    "UP",  
]

ignore = [
    "E501",  
    "B008",  
    "C901",  
    "W191", 
    "F722", 
    "F821" 
]

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]